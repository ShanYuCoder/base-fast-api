[project]
name = "fast-api-base"
version = "0.1.0"
description = "Factory AI Platform — FastAPI backend base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.15.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "mkdocs>=1.6.0,<2",
  "mkdocs-material>=9.5.0",
]
docs = [
  "mkdocs>=1.6.0,<2",
  "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: live service chain (skipped when server down)",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "mkdocs>=1.6.0,<2",
  "mkdocs-material>=9.5.0",
]
